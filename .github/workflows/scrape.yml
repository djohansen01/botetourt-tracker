name: Scrape Botetourt County

on:
  schedule:
    - cron: "30 6 * * *"   # daily at 6:30 AM UTC
  workflow_dispatch:        # allow manual trigger from GitHub UI

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run scraper
        run: python3 scraper.py

      - name: Commit updated data
        run: |
          git config user.name  "Botetourt Bot"
          git config user.email "bot@botetourt-tracker"
          git add data.json changelog.json
          if git diff --cached --quiet; then
            echo "No data changes to commit"
          else
            git commit -m "chore: auto-update data [$(date -u +%Y-%m-%dT%H:%M:%SZ)]"
            git push
          fi
